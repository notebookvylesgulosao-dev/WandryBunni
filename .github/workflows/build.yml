name: Build mod
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Resolver versões do Fabric
        run: python3 .github/scripts_resolve.py
      - name: Build
        shell: bash
        run: gradle build --stacktrace 2>&1 | tee build-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magia-arcana
          path: |
            build/libs/*.jar
            build-log.txt
      - name: Conteúdo do jar
        run: |
          JAR=$(ls build/libs/magia-arcana-*.jar | grep -v sources | head -1)
          unzip -l "$JAR" | grep -E "items/|models/item|textures/item|ModItems|lang/|fabric.mod"
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/magia-arcana-*.jar | grep -v sources | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "Build mais recente" --notes "Build automático do commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
